; PerfectPark v1 - ESP32-S3 firmware (Arduino / PlatformIO)
;
; Upload filesystem (web UI):
;   pio run -t uploadfs
; Upload firmware:
;   pio run -t upload

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = default.csv
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DSPOT_COUNT=3
lib_deps =
    mathieucarbou/ESPAsyncWebServer@^3.6.0
    mathieucarbou/AsyncTCP@^3.3.2
    bblanchon/ArduinoJson@^7.3.0
    tzapu/WiFiManager@^2.0.17

; Example: 2-spot garage
[env:esp32-s3-devkitc-1-2spots]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -USPOT_COUNT=3
    -DSPOT_COUNT=2

; OTA variants inherit the matching hardware configuration. Supply the device
; address with `pio run --upload-port` (the root Makefile uses ESP32_HOST).
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota

[env:esp32-s3-devkitc-1-2spots-ota]
extends = env:esp32-s3-devkitc-1-2spots
upload_protocol = espota
